name: Bug report
description: Report an issue or unexpected behavior in Wizard
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues before filing a duplicate.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel x86_64)
        - Linux (Ubuntu / Debian)
        - Linux (Fedora / Arch / RHEL)
        - Windows 11 / 10
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: execution_backend
    attributes:
      label: Execution Backend
      options:
        - Host Subprocess (EXECUTION_BACKEND=host, default)
        - Docker Container (EXECUTION_BACKEND=docker)
        - In-process (EXECUTION_BACKEND=inprocess)
    validations:
      required: true

  - type: dropdown
    id: model_provider
    attributes:
      label: LLM Provider
      options:
        - Ollama (Local)
        - LM Studio / Bionic (Local)
        - vLLM / Local Gateway
        - OpenAI / Hosted Provider
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Wizard Version / Release
      description: e.g. v1.0.1, v1.0.0, or git commit SHA
      placeholder: v1.0.1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What's happening?
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: 1. Launch Wizard with `...`\n2. Upload dataset `...`\n3. Ask question `...`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback & Logs
      description: Paste any error outputs from `wizard logs`, browser console, or terminal here.
      render: shell

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
